
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Magunga High</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101522;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1b2435;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0007;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aebbd0;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #39465e;
      border-radius: 8px;
      background: #111a2a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #2878ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #ffbd75;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #83b3ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h1>The Magunga High</h1>
    <p class="subtitle">Student Portal Login</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="email"
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="message" role="status"></p>

    <a class="back" href="index.html">Back to Home</a>
  </main>

  <script type="module">
    import { loginStudent } from "./assets/js/auth.js";
    import { db } from "./assets/js/firebase.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const user = await loginStudent(email, password);

        const profile = await getDoc(doc(db, "users", user.uid));

        if (!profile.exists()) {
          message.textContent = "Account profile not found.";
          return;
        }

        const data = profile.data();

        if (data.status !== "approved") {
          message.textContent =
            "Your account is awaiting approval. Contact your stream admin.";
          return;
        }

        if (data.role === "superadmin" ||
            data.role === "streamAdmin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "dashboard.html";
        }

      } catch (error) {
        message.textContent =
          "Login failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
