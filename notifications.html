
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d16">
<title>Notifications | Magunga High</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#090d16;color:#f5f7fb}
header{
 background:#111827;padding:15px;
 display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #80642f
}
header strong{color:#ffd36a}
header a{color:#ffd36a;text-decoration:none;font-size:12px}
main{max-width:760px;margin:auto;padding:16px}
.hero{
 padding:22px;border-radius:12px;
 background:linear-gradient(130deg,#30220d,#171d2c);
 border:1px solid #80642f;margin-bottom:18px
}
.hero h1{color:#ffe2a0;margin:0 0 8px}
.hero p{color:#c2c9d5;font-size:13px;line-height:1.6}
.toolbar{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;margin:16px 0
}
button{
 padding:10px 13px;border-radius:7px;
 border:1px solid #9a7634;background:#302511;
 color:#ffe1a0;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
#count{font-size:12px;color:#c2c9d5}
.notice{
 display:flex;gap:12px;padding:15px;
 background:#172337;border:1px solid #34445c;
 border-radius:10px;margin-bottom:11px
}
.notice.unread{border-color:#d9ad50}
.symbol{
 width:38px;height:38px;flex-shrink:0;
 display:grid;place-items:center;
 background:#302511;border-radius:9px;font-size:18px
}
.details{flex:1;min-width:0}
.details h3{margin:0 0 7px;color:#ffe0a0;font-size:14px}
.details p{font-size:12px;color:#d0d7e2;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{
 display:inline-block;padding:4px 7px;
 background:#382b15;color:#ffe1a0;
 font-size:9px;border-radius:20px;margin-bottom:7px
}
.meta{font-size:10px;color:#8999b0;margin-top:8px}
.empty{
 padding:30px 15px;text-align:center;
 background:#121c2d;border:1px dashed #526078;
 border-radius:10px;color:#aeb9ca;font-size:13px
}
#status{font-size:12px;color:#ffbd75;line-height:1.5}
footer{text-align:center;color:#78869a;padding:22px;font-size:10px}
@media(max-width:420px){
 main{padding:11px}
 .toolbar{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<header>
<strong>THE MAGUNGA HIGH</strong>
<a href="dashboard.html">← Dashboard</a>
</header>

<main>

<section class="hero">
<h1>🔔 Notifications</h1>
<p>
Stay updated with school announcements,
stream messages, group conversations
and private messages.
</p>
</section>

<div class="toolbar">
<span id="count">Loading notifications...</span>
<button id="markRead" disabled>Mark all as read</button>
</div>

<p id="status" role="status"></p>

<section id="feed">
<div class="empty">Loading updates...</div>
</section>

</main>

<footer>
THE MAGUNGA HIGH · STUDENT COMMUNITY
</footer>

<script type="module">

import {auth,db} from "./assets/js/firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
collection,doc,getDoc,getDocs,query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

let currentUser=null;
let notifications=[];
let seenAt=0;
let refreshTimer=null;

function timestamp(value){
return value?.toMillis?.() || 0;
}

function addItems(items,type,titleFor,bodyFor,icon,link){

items.forEach(item=>{
notifications.push({
id:item.id,
type,
title:titleFor(item.data),
body:bodyFor(item.data),
icon,
link,
time:timestamp(item.data.createdAt)
});
});

}

function render(){

const feed=$("feed");
feed.replaceChildren();

notifications.sort((a,b)=>b.time-a.time);

const visible=notifications.slice(0,100);

const unread=visible.filter(item=>item.time>seenAt).length;

$("count").textContent=
unread+" unread · "+visible.length+" recent updates";

$("markRead").disabled=unread===0;

if(!visible.length){

const empty=document.createElement("div");
empty.className="empty";
empty.textContent="You're all caught up. New updates will appear here.";

feed.appendChild(empty);
return;

}

visible.forEach(item=>{

const card=document.createElement("article");
card.className="notice"+(item.time>seenAt?" unread":"");

const symbol=document.createElement("div");
symbol.className="symbol";
symbol.textContent=item.icon;

const details=document.createElement("div");
details.className="details";

const tag=document.createElement("span");
tag.className="tag";
tag.textContent=item.type;

const heading=document.createElement("h3");
heading.textContent=item.title;

const body=document.createElement("p");
body.textContent=item.body;

const meta=document.createElement("div");
meta.className="meta";
meta.textContent=item.time
?new Date(item.time).toLocaleString()
:"Recently";

details.append(tag,heading,body,meta);
card.append(symbol,details);

card.addEventListener("click",()=>{

if(item.time>seenAt){

seenAt=item.time;

localStorage.setItem(
"magunga_notifications_seen_"+currentUser.uid,
String(seenAt)
);

render();

}

if(item.link){
location.href=item.link;
}

});

feed.appendChild(card);

});

}

async function loadNotifications(){

if(!currentUser)return;

$("status").textContent="Checking updates...";

notifications=[];

const profileSnap=await getDoc(
doc(db,"users",currentUser.uid)
);

if(!profileSnap.exists()){
throw new Error("Student profile not found.");
}

const profile=profileSnap.data();

if(profile.status!=="approved"){
throw new Error("Your account is not approved.");
}

const stream=profile.stream;

if(!stream)throw new Error("Your stream is missing from your profile.");

const [
announcementSnap,
streamSnap,
groupSnap,
privateSnap
]=await Promise.all([

getDocs(query(
collection(db,"announcements"),
where("stream","in",[stream,"All"])
)),

getDocs(query(
collection(db,"messages"),
where("stream","==",stream)
)),

getDocs(collection(db,"groupMessages")),

getDocs(query(
collection(db,"privateChats"),
where("participants","array-contains",currentUser.uid)
))

]);

// SCHOOL ANNOUNCEMENTS

addItems(
announcementSnap.docs.map(d=>({id:d.id,data:d.data()})),
"ANNOUNCEMENT",
d=>d.title||"School announcement",
d=>d.message||"",
"📢",
"announcements.html"
);

// STREAM MESSAGES

addItems(
streamSnap.docs
.filter(d=>d.data().senderId!==currentUser.uid)
.map(d=>({id:d.id,data:d.data()})),
"STREAM CHAT",
d=>(d.senderName||"Student")+" sent a stream message",
d=>d.text||"",
"💬",
"chat.html"
);

// SCHOOL GROUP MESSAGES

addItems(
groupSnap.docs
.filter(d=>d.data().senderId!==currentUser.uid)
.map(d=>({id:d.id,data:d.data()})),
"SCHOOL GROUP",
d=>(d.senderName||"Student")+" sent a group message",
d=>d.text||"",
"👥",
"chat.html"
);

// PRIVATE MESSAGES

const privateResults=await Promise.all(

privateSnap.docs.map(async chatDoc=>{

const messages=await getDocs(
collection(db,"privateChats",chatDoc.id,"messages")
);

return messages.docs
.filter(message=>
message.data().senderId!==currentUser.uid
)
.map(message=>({
id:chatDoc.id+"_"+message.id,
data:message.data()
}));

})

);

privateResults.flat().forEach(item=>{

const data=item.data;

notifications.push({

id:item.id,
type:"PRIVATE MESSAGE",

title:(data.senderName||"Student")+" sent you a message",

body:data.text||"",
icon:"✉️",
link:"chat.html",
time:timestamp(data.createdAt)

});

});

$("status").textContent="";

render();

}

// MARK ALL AS READ

$("markRead").addEventListener("click",()=>{

seenAt=Date.now();

localStorage.setItem(
"magunga_notifications_seen_"+currentUser.uid,
String(seenAt)
);

render();

});

// AUTHENTICATION

onAuthStateChanged(auth,async user=>{

if(!user){
location.href="login.html";
return;
}

currentUser=user;

seenAt=Number(
localStorage.getItem(
"magunga_notifications_seen_"+user.uid
)||0
);

try{

await loadNotifications();

if(refreshTimer)clearInterval(refreshTimer);

refreshTimer=setInterval(async()=>{

try{
await loadNotifications();
}catch(error){
console.error(error);
}

},30000);

}catch(error){

console.error(error);

$("status").textContent=
"Unable to load notifications: "+error.message;

$("feed").replaceChildren();

const empty=document.createElement("div");
empty.className="empty";
empty.textContent="Check your internet connection and Firestore permissions.";

$("feed").appendChild(empty);

}

});

window.addEventListener("beforeunload",()=>{
if(refreshTimer)clearInterval(refreshTimer);
});

</script>

</body>
</html>
