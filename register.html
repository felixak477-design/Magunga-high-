
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | The Magunga High</title>

<style>
* {
 box-sizing: border-box;
 font-family: Arial, sans-serif;
}

body {
 margin: 0;
 min-height: 100vh;
 display: grid;
 place-items: center;
 padding: 24px 16px;
 color: white;

 background:
  linear-gradient(
   rgba(5, 9, 17, .25),
   rgba(5, 9, 17, .40)
  ),
  url("assets/images/registration-students.png")
  center center / cover no-repeat fixed;
}

.register-box {
 width: 100%;
 max-width: 430px;
 padding: 30px;

 background: transparent;
 border: none;
 border-radius: 0;
 box-shadow: none;

 backdrop-filter: none;
 -webkit-backdrop-filter: none;
}

h1, .subtitle {
 text-align: center;
 text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

h1 {
 margin-bottom: 8px;
}

.subtitle {
 color: #fff;
 margin-top: 0;
}

label {
 display: block;
 margin: 15px 0 7px;
 font-size: 14px;
 font-weight: bold;
 text-shadow: 0 2px 5px rgba(0,0,0,.9);
}

input, select {
 width: 100%;
 padding: 14px;
 border: none;
 border-radius: 10px;
 background: rgba(8, 14, 25, .72);
 color: white;
 font-size: 16px;
 outline: none;
 box-shadow: none;
}

input:focus, select:focus {
 background: rgba(8, 14, 25, .88);
 box-shadow: 0 0 0 2px rgba(213,165,43,.65);
}

input::placeholder {
 color: #d5dce8;
}

select option {
 background: #111a2a;
 color: white;
}

input[type="file"] {
 font-size: 13px;
}

button {
 width: 100%;
 padding: 14px;
 margin-top: 22px;
 border: 0;
 border-radius: 10px;
 background: #d5a52b;
 color: #171717;
 font-size: 16px;
 font-weight: bold;
 cursor: pointer;
}

button:disabled {
 opacity: .6;
 cursor: not-allowed;
}

#message {
 text-align: center;
 color: #ffbd75;
 line-height: 1.6;
 overflow-wrap: anywhere;
 text-shadow: 0 2px 5px rgba(0,0,0,.9);
}

a {
 color: #ffe08a;
 text-decoration: none;
}

a:hover {
 text-decoration: underline;
}

.login-link {
 text-align: center;
 text-shadow: 0 2px 5px rgba(0,0,0,.9);
}

.preview {
 display: none;
 width: 90px;
 height: 90px;
 object-fit: cover;
 border-radius: 50%;
 margin: 12px auto;
 border: 2px solid #d5a52b;
}

.hint {
 font-size: 12px;
 color: white;
 text-shadow: 0 2px 5px rgba(0,0,0,.9);
}

@media (max-width: 600px) {
 body {
  padding: 16px 12px;
  background-attachment: scroll;
 }

 .register-box {
  padding: 23px 19px;
 }
}
</style>
</head>

<body>

<main class="register-box">

<h1>The Magunga High</h1>
<p class="subtitle">Create Your Student Account</p>

<form id="registerForm">

<label>Full name</label>
<input id="name" type="text" required maxlength="60">

<label>Email address</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required minlength="6">

<label>Select your stream</label>
<select id="stream" required>
<option value="">Choose your stream</option>
<option>Victors</option>
<option>Heroes</option>
<option>Winners</option>
<option>Champions</option>
<option>Archivers</option>
</select>

<label>Profile picture (optional)</label>
<input
 id="profilePhoto"
 type="file"
 accept="image/png,image/jpeg,image/webp"
>

<p class="hint">Maximum image size: 3 MB.</p>

<img id="preview" class="preview" alt="Preview">

<button type="submit" id="registerButton">
Create Account
</button>

</form>

<p id="message" role="status" aria-live="polite"></p>

<p class="login-link">
Already registered?
<a href="login.html">Login here</a>
</p>

</main>

<script type="module">

import { registerStudent } from "./assets/js/auth.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");
const photoInput = document.getElementById("profilePhoto");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", () => {

 const file = photoInput.files[0];

 if (!file) {
  preview.style.display = "none";
  return;
 }

 preview.src = URL.createObjectURL(file);
 preview.style.display = "block";

});

form.addEventListener("submit", async event => {

 event.preventDefault();
 button.disabled = true;

 try {

  message.textContent = "Creating your account and sending verification email...";

  await registerStudent(
   document.getElementById("name").value.trim(),
   document.getElementById("email").value.trim(),
   document.getElementById("password").value,
   document.getElementById("stream").value,
   photoInput.files[0] || null
  );

  message.textContent =
   "Account created! A verification email has been sent. Open your inbox, click the verification link, then return here to log in. Check your spam folder if necessary.";

  message.style.color = "#b8efbd";

  form.reset();
  preview.style.display = "none";

 } catch(error) {

  console.error("Registration error:", error);

  message.style.color = "#ffbd75";

  message.textContent =
   "Registration failed: " + (error.code || error.message);

 } finally {

  button.disabled = false;

 }

});

</script>

</body>
</html>
