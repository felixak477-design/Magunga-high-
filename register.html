
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | The Magunga High</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101522;
      color: white;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      background: #1b2435;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0007;
    }

    h1, .subtitle {
      text-align: center;
    }

    .subtitle {
      color: #aebbd0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #39465e;
      border-radius: 8px;
      background: #111a2a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #2878ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #ffbd75;
    }

    a {
      color: #83b3ff;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="register-box">
    <h1>The Magunga High</h1>
    <p class="subtitle">Create Your Student Account</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input
        id="name"
        type="text"
        required
        maxlength="80"
        placeholder="Enter your full name"
      >

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        required
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        required
        minlength="6"
        placeholder="At least 6 characters"
      >

      <label for="stream">Select your stream</label>
      <select id="stream" required>
        <option value="">Choose your stream</option>
        <option value="Victors">Victors</option>
        <option value="Heroes">Heroes</option>
        <option value="Winners">Winners</option>
        <option value="Champions">Champions</option>
        <option value="Archivers">Archivers</option>
      </select>

      <button type="submit" id="registerButton">
        Create Account
      </button>
    </form>

    <p id="message" role="status"></p>

    <p class="login-link">
      Already registered?
      <a href="login.html">Login here</a>
    </p>
  </main>

  <script type="module">
    import { registerStudent } from "./assets/js/auth.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Creating your account...";

      try {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const stream = document.getElementById("stream").value;

        await registerStudent(name, email, password, stream);

        message.textContent =
          "Account created! Your registration is awaiting admin approval.";

        form.reset();

      } catch (error) {
        message.textContent =
          "Registration failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
