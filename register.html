
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | The Magunga High</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
 margin:0;min-height:100vh;display:grid;
 place-items:center;padding:20px;
 background:#101522;color:white
}
.register-box{
 width:100%;max-width:430px;padding:30px;
 background:#1b2435;border:1px solid #5b4820;
 border-radius:16px;box-shadow:0 0 24px #d6a52b25
}
h1,.subtitle{text-align:center}
.subtitle{color:#aebbd0}
label{display:block;margin:15px 0 7px}
input,select{
 width:100%;padding:13px;border:1px solid #39465e;
 border-radius:8px;background:#111a2a;
 color:white;font-size:16px
}
button{
 width:100%;padding:14px;margin-top:22px;
 border:0;border-radius:8px;background:#d5a52b;
 color:#171717;font-size:16px;font-weight:bold
}
button:disabled{opacity:.6}
#message{text-align:center;color:#ffbd75}
a{color:#e8c45e}
.login-link{text-align:center}
.preview{
 display:none;width:90px;height:90px;
 object-fit:cover;border-radius:50%;
 margin:12px auto;border:2px solid #d5a52b
}
.hint{font-size:12px;color:#aebbd0}
</style>
</head>

<body>

<main class="register-box">

<h1>The Magunga High</h1>
<p class="subtitle">Create Your Student Account</p>

<form id="registerForm">

<label>Full name</label>
<input id="name" type="text" required maxlength="60">

<label>Email address</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required minlength="6">

<label>Select your stream</label>
<select id="stream" required>
<option value="">Choose your stream</option>
<option>Victors</option>
<option>Heroes</option>
<option>Winners</option>
<option>Champions</option>
<option>Archivers</option>
</select>

<label>Profile picture (optional)</label>
<input
 id="profilePhoto"
 type="file"
 accept="image/png,image/jpeg,image/webp"
>

<p class="hint">Maximum image size: 3 MB.</p>

<img id="preview" class="preview" alt="Preview">

<button type="submit" id="registerButton">
Create Account
</button>

</form>

<p id="message"></p>

<p class="login-link">
Already registered?
<a href="login.html">Login here</a>
</p>

</main>

<script type="module">

import { registerStudent } from "./assets/js/auth.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");
const photoInput = document.getElementById("profilePhoto");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", () => {
 const file = photoInput.files[0];

 if (!file) {
  preview.style.display = "none";
  return;
 }

 preview.src = URL.createObjectURL(file);
 preview.style.display = "block";
});

form.addEventListener("submit", async event => {

 event.preventDefault();
 button.disabled = true;

 try {

  message.textContent = "Creating account...";

  await registerStudent(
   document.getElementById("name").value.trim(),
   document.getElementById("email").value.trim(),
   document.getElementById("password").value,
   document.getElementById("stream").value,
   photoInput.files[0] || null
  );

  message.textContent =
   "Account created! Awaiting admin approval.";

  form.reset();
  preview.style.display = "none";

 } catch(error) {

  message.textContent =
   "Registration failed: " + error.message;

 } finally {
  button.disabled = false;
 }

});

</script>

</body>
</html>
