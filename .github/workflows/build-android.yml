
name: Build Magunga High APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - 'www/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root_file = Path("android/build.gradle")
          app_file = Path("android/app/build.gradle")

          root = root_file.read_text()
          app = app_file.read_text()

          if "com.google.gms:google-services" not in root:
              match = re.search(r"dependencies\s*\{", root)
              if not match:
                  raise SystemExit("Could not find root Gradle dependencies block.")
              pos = match.end()
              root = (
                  root[:pos]
                  + "\n        classpath 'com.google.gms:google-services:4.4.2'"
                  + root[pos:]
              )

          if "com.google.gms.google-services" not in app:
              apply_line = re.search(
                  r"(?m)^apply plugin:\s*['\"]com\.android\.application['\"]\s*$",
                  app
              )

              if apply_line:
                  pos = apply_line.end()
                  app = (
                      app[:pos]
                      + "\napply plugin: 'com.google.gms.google-services'"
                      + app[pos:]
                  )
              else:
                  plugin_line = re.search(
                      r"(?m)^\s*id\s*['\"]com\.android\.application['\"]\s*$",
                      app
                  )
                  if not plugin_line:
                      raise SystemExit("Could not find Android application plugin.")
                  pos = plugin_line.end()
                  app = (
                      app[:pos]
                      + "\n    id 'com.google.gms.google-services'"
                      + app[pos:]
                  )

          root_file.write_text(root)
          app_file.write_text(app)
          print("Google Services plugin configured.")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magunga-high-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
