
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>Digital Library | Magunga High</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  padding-top: 70px;
  background: #090d16;
  color: #f4f6fb;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  min-height: 65px;
  background: #111827;
  border-bottom: 1px solid #34445f;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  padding: 5px 8px;
  overflow-x: auto;
  z-index: 1000;
}

.topbar a {
  color: #aebbd0;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  padding: 12px 10px;
  border-radius: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.topbar a.active {
  color: #f4d58a;
  background: #302511;
}

main {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 12px 15px 100px;
}

.page-heading {
  color: #f4d58a;
  font-size: 23px;
  margin: 12px 0 5px;
}

.page-description {
  color: #aebbd0;
  font-size: 13px;
  line-height: 1.5;
  margin: 0 0 15px;
}

#status {
  color: #aebbd0;
  font-size: 13px;
  padding: 10px 2px;
}

.post {
  padding: 18px 4px;
  border-bottom: 1px solid #263449;
  width: 100%;
}

.uploader {
  color: #f4d58a;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

.date {
  color: #8795aa;
  font-size: 12px;
  margin-bottom: 13px;
}

.file-name {
  font-size: 15px;
  color: #e8edf6;
  overflow-wrap: anywhere;
  margin-bottom: 12px;
}

.library-image {
  display: block;
  width: 100%;
  max-width: 100%;
  max-height: 560px;
  object-fit: contain;
  border-radius: 10px;
  margin: 12px 0;
  background: #111827;
}

.image-loading {
  padding: 22px 12px;
  background: #111827;
  border-radius: 9px;
  color: #aebbd0;
  font-size: 13px;
  margin: 10px 0;
}

.open-file {
  display: inline-block;
  color: #f4d58a;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  padding: 10px 0;
}

.empty {
  text-align: center;
  color: #aebbd0;
  padding: 45px 15px;
  line-height: 1.6;
}

#addButton {
  position: fixed;
  right: 22px;
  bottom: 25px;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  background: #d5a52b;
  color: #17120a;
  font-size: 34px;
  cursor: pointer;
  box-shadow: 0 5px 20px #0008;
  z-index: 1100;
}

#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal-content {
  width: 100%;
  max-width: 460px;
  max-height: 88dvh;
  overflow-y: auto;
  background: #141e30;
  border: 1px solid #34445f;
  border-radius: 15px;
  padding: 20px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.modal-header h2 {
  margin: 0;
  color: #f4d58a;
  font-size: 20px;
}

#closeModal {
  background: transparent;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

#fileInput {
  display: none;
}

.file-picker {
  display: block;
  padding: 27px 15px;
  border: 2px dashed #52647e;
  border-radius: 12px;
  text-align: center;
  color: #d4dbea;
  cursor: pointer;
  line-height: 1.7;
}

.file-picker strong {
  display: block;
  color: #f4d58a;
  font-size: 16px;
}

#selectedFile {
  margin-top: 12px;
  color: #aebbd0;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#selectedPreviews {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 12px;
}

.selected-preview {
  width: 100%;
  max-height: 130px;
  object-fit: contain;
  background: #090d16;
  border-radius: 8px;
}

#uploadButton {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 9px;
  background: #d5a52b;
  color: #17120a;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

#uploadButton:disabled {
  opacity: .6;
  cursor: wait;
}

#uploadMessage {
  color: #f4d58a;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.delete-button {
  margin: 10px 0;
  padding: 9px 14px;
  border: none;
  border-radius: 7px;
  background: #7f2934;
  color: white;
  cursor: pointer;
}

@media(max-width:500px) {
  body {
    padding-top: 68px;
  }

  .topbar {
    justify-content: flex-start;
    min-height: 62px;
  }

  .topbar a {
    font-size: 12px;
    padding: 11px 9px;
  }

  main {
    padding-left: 12px;
    padding-right: 12px;
  }

  .modal-content {
    padding: 16px;
  }

  #addButton {
    right: 16px;
    bottom: 18px;
  }
}
</style>
</head>

<body>

<nav class="topbar">
  <a href="dashboard.html">Home</a>
  <a href="community.html">Friends</a>
  <a href="chat.html">Messages</a>
  <a href="notifications.html">Alerts</a>
  <a href="profile.html">Account</a>
  <a href="library.html" class="active">Library</a>
</nav>

<main>
  <h1 class="page-heading">Digital Library</h1>
  <p class="page-description">
    Learning materials, notes, documents and pictures shared by the Magunga High community.
  </p>

  <p id="status">Loading library...</p>
  <section id="resources"></section>
</main>

<button id="addButton" title="Upload material" aria-label="Upload material">+</button>

<div id="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Upload materials</h2>
      <button id="closeModal" aria-label="Close">&times;</button>
    </div>

    <label class="file-picker" for="fileInput">
      <strong>Choose files</strong>
      Select one or several PDFs or pictures from your device.
    </label>

    <input
      type="file"
      id="fileInput"
      multiple
      accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"
    >

    <div id="selectedFile">No files selected</div>
    <div id="selectedPreviews"></div>

    <button id="uploadButton">Upload materials</button>
    <p id="uploadMessage"></p>

  </div>
</div>

<script type="module">

import { auth, db }
from "./assets/js/firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  collection,
  getDocs,
  query,
  where,
  doc,
  getDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";


const statusText = document.getElementById("status");
const container = document.getElementById("resources");

const modal = document.getElementById("modal");
const addButton = document.getElementById("addButton");
const closeModal = document.getElementById("closeModal");

const fileInput = document.getElementById("fileInput");
const selectedFile = document.getElementById("selectedFile");
const selectedPreviews = document.getElementById("selectedPreviews");

const uploadButton = document.getElementById("uploadButton");
const uploadMessage = document.getElementById("uploadMessage");

let currentUser = null;
let currentProfile = {};
let materials = [];
let previewUrls = [];


// OPEN AND CLOSE UPLOAD WINDOW

function openUploadWindow() {
  modal.style.display = "flex";
}

addButton.addEventListener("click", openUploadWindow);

closeModal.addEventListener("click", closeUploadWindow);

modal.addEventListener("click", event => {
  if (event.target === modal) {
    closeUploadWindow();
  }
});

function closeUploadWindow() {
  modal.style.display = "none";
  resetUploadForm();
}

function resetUploadForm() {
  fileInput.value = "";
  selectedFile.textContent = "No files selected";
  selectedPreviews.replaceChildren();
  uploadMessage.textContent = "";

  previewUrls.forEach(url => URL.revokeObjectURL(url));
  previewUrls = [];

  uploadButton.disabled = false;
  uploadButton.textContent = "Upload materials";
}


// FILE SELECTION AND PREVIEWS

fileInput.addEventListener("change", () => {

  previewUrls.forEach(url => URL.revokeObjectURL(url));
  previewUrls = [];
  selectedPreviews.replaceChildren();

  const files = Array.from(fileInput.files || []);

  if (!files.length) {
    selectedFile.textContent = "No files selected";
    return;
  }

  selectedFile.textContent =
    files.length + " file(s) selected:\n" +
    files.map(file =>
      file.name + " · " +
      (file.size / 1024 / 1024).toFixed(2) + " MB"
    ).join("\n");

  files.forEach(file => {

    if (!file.type.startsWith("image/")) return;

    const url = URL.createObjectURL(file);
    previewUrls.push(url);

    const image = document.createElement("img");
    image.className = "selected-preview";
    image.src = url;
    image.alt = file.name;

    selectedPreviews.append(image);

  });

});


// SECURE DOWNLOAD URL

async function getDownloadUrl(resourceId) {

  const token = await currentUser.getIdToken();

  const response = await fetch(
    "/api/library-download-url",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        resourceId: resourceId
      })
    }
  );

  const result = await response.json();

  if (!response.ok || !result.downloadUrl) {
    throw new Error(result.error || "Could not load this picture.");
  }

  return result.downloadUrl;
}


// LOAD LIBRARY MATERIALS

async function loadMaterials() {

  statusText.textContent = "Loading materials...";

  const snapshot = await getDocs(
    query(
      collection(db, "libraryResources"),
      where("status", "==", "approved")
    )
  );

  materials = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  materials.sort((a, b) => {
    const first = a.createdAt?.seconds || 0;
    const second = b.createdAt?.seconds || 0;
    return second - first;
  });

  await renderMaterials();

}


function formatDate(timestamp) {

  if (!timestamp?.toDate) return "";

  return timestamp.toDate().toLocaleString();

}


// DISPLAY LIBRARY MATERIALS

async function renderMaterials() {

  container.replaceChildren();

  if (!materials.length) {

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No materials have been uploaded yet.";

    container.append(empty);
    statusText.textContent = "";

    return;
  }

  statusText.textContent = "";

  for (const material of materials) {

    const post = document.createElement("article");
    post.className = "post";

    const uploader = document.createElement("div");
    uploader.className = "uploader";
    uploader.textContent =
      material.uploaderName || "Magunga High student";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = formatDate(material.createdAt);

    const filename = document.createElement("div");
    filename.className = "file-name";
    filename.textContent =
      material.fileName || material.title || "Uploaded material";

    post.append(uploader, date, filename);

    const isImage =
      material.contentType?.startsWith("image/");

    if (isImage) {

      const loading = document.createElement("div");
      loading.className = "image-loading";
      loading.textContent = "Loading picture preview...";

      post.append(loading);

      const image = document.createElement("img");
      image.className = "library-image";
      image.alt = material.fileName || "Library picture";
      image.loading = "lazy";

      try {

        const downloadUrl = await getDownloadUrl(material.id);

        image.src = downloadUrl;

        image.addEventListener("load", () => {
          loading.remove();
        });

        image.addEventListener("error", () => {
          loading.textContent = "Picture preview could not be displayed.";
        });

        post.append(image);

      } catch (error) {

        loading.textContent =
          "Picture preview unavailable: " + error.message;

      }

    } else {

      const openLink = document.createElement("a");
      openLink.className = "open-file";
      openLink.href = "#";
      openLink.textContent = "Open PDF";

      openLink.addEventListener("click", async event => {

        event.preventDefault();

        openLink.textContent = "Preparing PDF...";

        const newTab = window.open("about:blank", "_blank");

        try {

          const downloadUrl = await getDownloadUrl(material.id);

          if (newTab) {
            newTab.location.href = downloadUrl;
          } else {
            window.location.href = downloadUrl;
          }

        } catch (error) {

          if (newTab) newTab.close();

          alert(error.message);

        } finally {

          openLink.textContent = "Open PDF";

        }

      });

      post.append(openLink);

    }


    // SUPERADMIN-ONLY DELETE CONTROL

    if (currentProfile.role === "superadmin") {

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Delete material";

      deleteButton.addEventListener("click", async () => {

        if (!confirm("Delete this uploaded material?")) return;

        deleteButton.disabled = true;
        deleteButton.textContent = "Deleting...";

        try {

          const token = await currentUser.getIdToken();

          const response = await fetch(
            "/api/library-delete-file",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              },
              body: JSON.stringify({
                resourceId: material.id
              })
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || "Could not delete material.");
          }

          materials = materials.filter(
            item => item.id !== material.id
          );

          await renderMaterials();

        } catch (error) {

          alert(error.message);
          deleteButton.disabled = false;
          deleteButton.textContent = "Delete material";

        }

      });

      post.append(deleteButton);

    }

    container.append(post);

  }

}


// UPLOAD ONE FILE

async function uploadOneFile(file) {

  const token = await currentUser.getIdToken();

  // REQUEST SECURE SUPABASE UPLOAD URL

  const response = await fetch(
    "/api/library-upload-url",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        fileName: file.name,
        contentType: file.type,
        fileSize: file.size
      })
    }
  );

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "Could not prepare upload.");
  }

  if (!result.path || !result.token) {
    throw new Error("The upload server returned incomplete information.");
  }


  // UPLOAD FILE TO PRIVATE SUPABASE STORAGE

  const storageResponse = await fetch(
    "https://kfopwukxanxigsupnfee.supabase.co/storage/v1/object/upload/sign/magunga-library/" +
    result.path.split("/").map(encodeURIComponent).join("/") +
    "?token=" + encodeURIComponent(result.token),
    {
      method: "PUT",
      headers: {
        "Content-Type": file.type,
        "x-upsert": "false"
      },
      body: file
    }
  );

  if (!storageResponse.ok) {
    const errorText = await storageResponse.text();
    throw new Error("Storage upload failed: " + errorText);
  }


  // SAVE MATERIAL DETAILS IN FIRESTORE

  const profileName =
    currentProfile.displayName ||
    currentProfile.fullName ||
    currentProfile.name ||
    currentUser.displayName ||
    currentUser.email ||
    "Magunga High student";

  await addDoc(
    collection(db, "libraryResources"),
    {
      title: file.name,
      subject: "General",
      classLevel: "",
      topic: "",
      description: "",
      fileName: file.name,
      filePath: result.path,
      fileSize: file.size,
      contentType: file.type,
      uploadedBy: currentUser.uid,
      uploaderName: profileName,
      status: "approved",
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      reviewedBy: null,
      reviewedAt: null
    }
  );

}


// UPLOAD SELECTED FILES

uploadButton.addEventListener("click", async () => {

  const files = Array.from(fileInput.files || []);

  if (!files.length) {
    uploadMessage.textContent = "Choose at least one file first.";
    return;
  }

  const allowedTypes = [
    "application/pdf",
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  // VALIDATE ALL FILES BEFORE STARTING

  for (const file of files) {

    if (!allowedTypes.includes(file.type)) {
      uploadMessage.textContent =
        "Unsupported file: " + file.name +
        ". Only PDF, JPG, PNG and WebP are allowed.";
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      uploadMessage.textContent =
        file.name + " is larger than the 20 MB limit.";
      return;
    }

  }

  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";
  fileInput.disabled = true;

  let uploadedCount = 0;

  try {

    for (const file of files) {

      uploadMessage.textContent =
        "Uploading " + (uploadedCount + 1) +
        " of " + files.length + ": " + file.name;

      await uploadOneFile(file);

      uploadedCount++;

    }

    uploadMessage.textContent =
      "Successfully uploaded " + uploadedCount + " file(s).";

    await loadMaterials();

    setTimeout(() => {
      closeUploadWindow();
    }, 1000);

  } catch (error) {

    console.error(error);

    uploadMessage.textContent =
      uploadedCount + " of " + files.length +
      " file(s) uploaded. Error: " +
      (error.message || "Upload failed.");

    uploadButton.disabled = false;
    uploadButton.textContent = "Retry remaining files";

    // Keep the selected files visible.
    // Already uploaded files may need to be removed from selection
    // before retrying to avoid uploading them again.

  } finally {

    fileInput.disabled = false;

  }

});


// CHECK LOGIN AND ACCOUNT APPROVAL

onAuthStateChanged(auth, async user => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  currentUser = user;

  try {

    const profileSnapshot = await getDoc(
      doc(db, "users", user.uid)
    );

    if (!profileSnapshot.exists()) {

      statusText.textContent = "Your account profile was not found.";
      addButton.style.display = "none";
      return;

    }

    currentProfile = profileSnapshot.data();

    if (currentProfile.status !== "approved") {

      statusText.textContent =
        "Your account must be approved to access the library.";

      addButton.style.display = "none";
      return;

    }

    await loadMaterials();

    // Open the upload window when dashboard card links to #upload.

    if (window.location.hash === "#upload") {
      openUploadWindow();
    }

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Could not load the library: " + error.message;

  }

});

</script>

</body>
</html>
