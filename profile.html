
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101522">
<title>Member Profile | Magunga High</title>

<style>
* {
 box-sizing: border-box;
 font-family: Arial, sans-serif;
}

body {
 margin: 0;
 background: #101522;
 color: white;
 padding-top: 75px;
}

/* FIXED NAVIGATION */

.topbar {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 height: 65px;
 background: #1b2435;
 border-bottom: 1px solid #344158;
 display: flex;
 align-items: center;
 justify-content: space-around;
 gap: 5px;
 padding: 0 8px;
 z-index: 1000;
}

.topbar a {
 color: #aab6c8;
 text-decoration: none;
 font-size: 13px;
 font-weight: bold;
 padding: 12px 10px;
 border-radius: 8px;
 white-space: nowrap;
}

.topbar a.active {
 color: #e8c45e;
 background: #293b59;
}

.topbar a:hover {
 color: #e8c45e;
}

main {
 max-width: 560px;
 margin: 30px auto;
 padding: 20px;
}

.profile-card {
 background: #1b2435;
 border: 1px solid #59471f;
 border-radius: 18px;
 padding: 25px;
 text-align: center;
 box-shadow: 0 0 18px #d5a52b18;
}

.avatar {
 width: 130px;
 height: 130px;
 border-radius: 50%;
 object-fit: cover;
 background: #293b59;
 border: 3px solid #d5a52b;
 margin: 8px auto;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 42px;
 color: #e8c45e;
}

.muted {
 color: #aab6c8;
}

label {
 display: block;
 text-align: left;
 margin: 16px 0 7px;
}

input {
 width: 100%;
 padding: 12px;
 border: 1px solid #39465e;
 border-radius: 8px;
 background: #111a2a;
 color: white;
}

button {
 width: 100%;
 padding: 13px;
 margin-top: 15px;
 background: #d5a52b;
 color: #171717;
 border: 0;
 border-radius: 8px;
 font-weight: bold;
 cursor: pointer;
}

button:disabled {
 opacity: .6;
}

.hidden {
 display: none;
}

#message {
 color: #ffbd75;
}

@media(max-width:480px) {
 .topbar {
  justify-content: flex-start;
  overflow-x: auto;
 }

 .topbar a {
  font-size: 12px;
  padding: 12px 9px;
 }

 main {
  padding: 12px;
 }
}
</style>
</head>

<body>

<!-- FIXED NAVIGATION -->

<nav class="topbar">
 <a href="dashboard.html">Home</a>
 <a href="community.html">Friends</a>
 <a href="chat.html">Messages</a>
 <a href="notifications.html">Alerts</a>
 <a href="profile.html" class="active">Account</a>
 <a href="library.html">Library</a>
</nav>

<main>

<section class="profile-card">

<img id="photo" class="avatar hidden" alt="Profile picture">

<div id="fallback" class="avatar">M</div>

<h1 id="displayName">Loading profile...</h1>

<p id="realName" class="muted"></p>

<p id="stream" class="muted"></p>

<div id="editArea" class="hidden">

<label>Nickname</label>

<input
 id="nickname"
 maxlength="30"
 placeholder="Choose nickname"
>

<label>Change profile picture</label>

<input
 id="photoFile"
 type="file"
 accept="image/png,image/jpeg,image/webp"
>

<p class="muted">Maximum 3 MB.</p>

<button id="saveButton">Save Profile</button>

</div>

<p id="message"></p>

</section>

</main>

<script type="module">

import {auth,db} from "./assets/js/firebase.js";

import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 doc,getDoc,writeBatch,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

import {uploadProfileImage} from "./assets/js/cloudinary.js";

const photo = document.getElementById("photo");
const fallback = document.getElementById("fallback");
const displayName = document.getElementById("displayName");
const realName = document.getElementById("realName");
const stream = document.getElementById("stream");
const editArea = document.getElementById("editArea");
const nicknameInput = document.getElementById("nickname");
const photoFile = document.getElementById("photoFile");
const saveButton = document.getElementById("saveButton");
const message = document.getElementById("message");

const targetUid = new URLSearchParams(location.search).get("uid");

let currentUser = null;
let currentData = null;

function showPhoto(url,name) {

 if(url && /^https:\/\//i.test(url)) {

  photo.src = url;
  photo.classList.remove("hidden");
  fallback.classList.add("hidden");

  photo.onerror = () => {

   photo.classList.add("hidden");
   fallback.classList.remove("hidden");

   fallback.textContent =
    (name || "M").charAt(0).toUpperCase();

  };

 } else {

  photo.classList.add("hidden");
  fallback.classList.remove("hidden");

  fallback.textContent =
   (name || "M").charAt(0).toUpperCase();

 }

}

async function loadProfile(user) {

 currentUser = user;

 const uid = targetUid || user.uid;

 const own = uid === user.uid;

 const snap = await getDoc(
  doc(db,"publicProfiles",uid)
 );

 if(!snap.exists() || snap.data().status !== "approved") {

  message.textContent = "This profile is unavailable.";

  displayName.textContent = "Profile not found";

  return;

 }

 currentData = snap.data();

 const shown =
  currentData.nickname || currentData.name || "Member";

 displayName.textContent = shown;

 realName.textContent = currentData.nickname
  ? currentData.name || ""
  : "";

 stream.textContent = currentData.stream || "";

 showPhoto(currentData.photoURL || "",shown);

 if(own) {

  editArea.classList.remove("hidden");

  nicknameInput.value = currentData.nickname || "";

 }

}

// SAVE PROFILE

saveButton.addEventListener("click",async() => {

 saveButton.disabled = true;

 message.textContent = "Saving profile...";

 try {

  const nickname = nicknameInput.value.trim();

  if(nickname.length > 30) {

   throw new Error(
    "Nickname must be 30 characters or fewer."
   );

  }

  const file = photoFile.files[0];

  if(file) {

   if(file.size > 3 * 1024 * 1024) {

    throw new Error(
     "Choose an image smaller than 3 MB."
    );

   }

   if(!["image/jpeg","image/png","image/webp"].includes(file.type)) {

    throw new Error(
     "Choose a JPG, PNG or WEBP image."
    );

   }

  }

  let photoURL = currentData.photoURL || "";

  if(file) {

   photoURL = await uploadProfileImage(file);

  }

  const changes = {
   nickname,
   profileUpdatedAt: serverTimestamp()
  };

  if(file) {
   changes.photoURL = photoURL;
  }

  const batch = writeBatch(db);

  batch.update(
   doc(db,"users",currentUser.uid),
   changes
  );

  batch.update(
   doc(db,"publicProfiles",currentUser.uid),
   changes
  );

  await batch.commit();

  currentData = {
   ...currentData,
   ...changes,
   photoURL
  };

  displayName.textContent =
   nickname || currentData.name;

  realName.textContent =
   nickname ? currentData.name || "" : "";

  showPhoto(
   photoURL,
   nickname || currentData.name
  );

  photoFile.value = "";

  message.textContent =
   "Profile updated successfully.";

 } catch(error) {

  console.error(error);

  message.textContent =
   error.message || "Could not update profile.";

 } finally {

  saveButton.disabled = false;

 }

});

// AUTHENTICATION

onAuthStateChanged(auth,user => {

 if(!user) {

  location.href = "login.html";

  return;

 }

 loadProfile(user).catch(error => {

  console.error(error);

  message.textContent =
   "Could not load profile. Check Firestore rules.";

 });

});

</script>

</body>
</html>
