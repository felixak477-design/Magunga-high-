
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Friends | Magunga High</title>

<style>
* {
 box-sizing: border-box;
 font-family: Arial, sans-serif;
}

html {
 width: 100%;
 height: 100%;
 overflow: hidden;
}

body {
 margin: 0;
 width: 100%;
 height: 100%;
 height: 100dvh;
 background: #101522;
 color: white;
 overflow: hidden;
 display: flex;
 flex-direction: column;
 padding-top: env(safe-area-inset-top, 0px);
}

/* TOP NAVIGATION */

.topbar {
 position: relative;
 flex: 0 0 auto;
 width: 100%;
 min-height: 58px;
 background: #1b2435;
 border-bottom: 1px solid #344158;
 display: flex;
 align-items: center;
 justify-content: flex-start;
 gap: 4px;
 padding: 5px 8px;
 z-index: 1000;
 overflow-x: auto;
 overflow-y: hidden;
 scrollbar-width: none;
 -webkit-overflow-scrolling: touch;
}

.topbar::-webkit-scrollbar {
 display: none;
}

.topbar a {
 flex: 0 0 auto;
 color: #aab6c8;
 text-decoration: none;
 font-size: 12px;
 font-weight: bold;
 padding: 11px 10px;
 border-radius: 8px;
 white-space: nowrap;
}

.topbar a.active {
 color: #e8c45e;
 background: #293b59;
}

.topbar a:hover {
 color: #e8c45e;
}

/* MAIN SCROLL AREA */

main {
 width: 100%;
 max-width: 950px;
 margin: 0 auto;
 padding: 16px 15px calc(20px + env(safe-area-inset-bottom, 0px));
 flex: 1 1 auto;
 min-height: 0;
 overflow-y: auto;
 overflow-x: hidden;
 overscroll-behavior-y: contain;
 -webkit-overflow-scrolling: touch;
 scrollbar-width: thin;
}

main::-webkit-scrollbar {
 width: 4px;
}

main::-webkit-scrollbar-thumb {
 background: #344158;
 border-radius: 10px;
}

h1 {
 font-size: 23px;
 margin: 4px 0 7px;
 color: #f2f4f8;
}

.muted {
 color: #aab6c8;
 font-size: 13px;
 line-height: 1.5;
 margin: 0 0 14px;
}

/* SEARCH AND FILTER */

input, select {
 display: block;
 width: 100%;
 min-width: 0;
 padding: 12px;
 margin: 8px 0;
 background: #1b2435;
 color: white;
 border: 1px solid #344158;
 border-radius: 9px;
 outline: none;
 font-size: 14px;
}

input:focus, select:focus {
 border-color: #d5a52b;
 box-shadow: 0 0 8px #d5a52b25;
}

input::placeholder {
 color: #8996aa;
}

select {
 color-scheme: dark;
}

/* STATUS MESSAGE */

#message {
 color: #ffbd75;
 margin: 12px 0;
 font-size: 12px;
 line-height: 1.5;
}

/* MEMBERS GRID */

.members {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr));
 gap: 11px;
 margin-top: 12px;
 width: 100%;
}

/* MEMBER CARD */

.member {
 min-width: 0;
 background: #1b2435;
 padding: 14px 9px;
 border: 1px solid #59471f;
 border-radius: 12px;
 text-align: center;
 cursor: pointer;
 transition: border-color .2s, box-shadow .2s;
 overflow: hidden;
}

.member:hover,
.member:focus-visible {
 border-color: #d5a52b;
 box-shadow: 0 4px 16px #d5a52220;
 outline: none;
}

.avatar {
 width: 66px;
 height: 66px;
 border-radius: 50%;
 object-fit: cover;
 background: #293b59;
 margin: 0 auto;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 23px;
 color: #e8c45e;
 border: 2px solid #d5a52b;
}

.member h3 {
 font-size: 14px;
 margin: 10px 0 4px;
 overflow-wrap: anywhere;
}

.member p {
 color: #aab6c8;
 font-size: 12px;
 margin: 4px 0 9px;
 overflow-wrap: anywhere;
}

.stream {
 display: inline-block;
 max-width: 100%;
 background: #293b59;
 color: #e8c45e;
 padding: 5px 10px;
 border-radius: 20px;
 font-size: 10px;
 overflow-wrap: anywhere;
}

/* SMALL PHONES */

@media(max-width: 380px) {
 .topbar {
  min-height: 53px;
 }

 .topbar a {
  font-size: 11px;
  padding: 10px 8px;
 }

 main {
  padding: 13px 11px calc(18px + env(safe-area-inset-bottom, 0px));
 }

 h1 {
  font-size: 21px;
 }

 .members {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
 }

 .member {
  padding: 12px 7px;
 }

 .avatar {
  width: 60px;
  height: 60px;
 }
}

/* SHORT SCREENS */

@media(max-height: 550px) {
 .topbar {
  min-height: 47px;
 }

 .topbar a {
  padding: 8px;
 }

 main {
  padding-top: 10px;
 }

 h1 {
  font-size: 20px;
  margin-top: 2px;
 }

 .muted {
  margin-bottom: 8px;
 }

 input, select {
  padding: 10px;
  margin: 6px 0;
 }
}

/* ACCESSIBILITY */

@media(prefers-reduced-motion: reduce) {
 * {
  scroll-behavior: auto !important;
  transition: none !important;
 }
}
</style>
</head>

<body>

<nav class="topbar">
 <a href="dashboard.html">Home</a>
 <a href="community.html" class="active">Friends</a>
 <a href="chat.html">Messages</a>
 <a href="notifications.html">Alerts</a>
 <a href="profile.html">Account</a>
 <a href="library.html">Library</a>
</nav>

<main>

<h1>👥 Friends</h1>
<p class="muted">Discover approved members of Magunga High.</p>

<input
 id="search"
 type="search"
 placeholder="Search members by name or nickname..."
>

<select id="streamFilter">
 <option value="all">All streams</option>
 <option value="Victors">Victors</option>
 <option value="Heroes">Heroes</option>
 <option value="Winners">Winners</option>
 <option value="Champions">Champions</option>
 <option value="Archivers">Archivers</option>
</select>

<p id="message">Loading members...</p>

<section class="members" id="members"></section>

</main>

<script type="module">

import {auth,db} from "./assets/js/firebase.js";

import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 collection,
 getDoc,
 doc,
 getDocs,
 query,
 where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const membersBox = document.getElementById("members");
const message = document.getElementById("message");
const search = document.getElementById("search");
const streamFilter = document.getElementById("streamFilter");

let members = [];

function makeMemberCard(member) {

 const card = document.createElement("article");

 card.className = "member";
 card.tabIndex = 0;

 const photo = member.photoURL || member.photoUrl || "";

 if(photo && /^https:\/\//i.test(photo)) {

  const img = document.createElement("img");

  img.className = "avatar";
  img.src = photo;
  img.alt = "Profile picture";

  img.onerror = () => {
   img.remove();
   addFallback();
  };

  card.appendChild(img);

 } else {

  addFallback();

 }

 function addFallback() {

  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
   (member.nickname || member.name || "M")
   .charAt(0).toUpperCase();

  card.prepend(avatar);

 }

 const heading = document.createElement("h3");

 heading.textContent =
  member.nickname || member.name || "Member";

 const realName = document.createElement("p");

 realName.textContent =
  member.nickname && member.name
   ? member.name
   : "";

 const stream = document.createElement("span");

 stream.className = "stream";
 stream.textContent = member.stream || "No stream";

 card.append(heading, realName, stream);

 const open = () => {
  location.href =
   "profile.html?uid=" + encodeURIComponent(member.id);
 };

 card.addEventListener("click", open);

 card.addEventListener("keydown", event => {
  if(event.key === "Enter") {
   open();
  }
 });

 return card;
}

function displayMembers() {

 membersBox.replaceChildren();

 const term = search.value.trim().toLowerCase();

 const selected = streamFilter.value;

 const filtered = members.filter(member => {

  const name = (member.name || "").toLowerCase();

  const nickname = (member.nickname || "").toLowerCase();

  const matchesSearch =
   !term ||
   name.includes(term) ||
   nickname.includes(term);

  const matchesStream =
   selected === "all" ||
   (member.stream || "").toLowerCase() ===
   selected.toLowerCase();

  return matchesSearch && matchesStream;

 });

 if(!filtered.length) {

  message.textContent = "No matching members found.";

  return;

 }

 message.textContent =
  filtered.length + " approved member(s) found.";

 filtered.forEach(member => {
  membersBox.appendChild(makeMemberCard(member));
 });

}

// LOAD APPROVED PUBLIC PROFILES

async function loadMembers() {

 try {

  message.textContent = "Loading members...";

  const result = await getDocs(
   query(
    collection(db, "publicProfiles"),
    where("status", "==", "approved")
   )
  );

  members = result.docs.map(item => ({
   id: item.id,
   ...item.data()
  }));

  displayMembers();

 } catch(error) {

  console.error(error);

  message.textContent =
   "Unable to load members: " + error.message;

 }

}

// CHECK ACCOUNT APPROVAL

onAuthStateChanged(auth, async user => {

 if(!user) {

  location.href = "login.html";

  return;

 }

 try {

  const profile = await getDoc(
   doc(db, "users", user.uid)
  );

  if(
   !profile.exists() ||
   profile.data().status !== "approved"
  ) {

   location.href = "login.html";

   return;

  }

  await loadMembers();

 } catch(error) {

  console.error(error);

  message.textContent =
   "Unable to verify your account: " + error.message;

 }

});

search.addEventListener("input", displayMembers);

streamFilter.addEventListener("change", displayMembers);

</script>

</body>
</html>
